name: CI

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

jobs:
  backend:
    name: Java backend
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "21"
          cache: maven
      - name: Build and test
        run: |
          chmod +x backend/mvnw
          ./backend/mvnw -B -f backend/pom.xml verify

  frontend:
    name: React frontend
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm
      - run: npm ci
      - name: Build
        run: npm run build --prefix frontend
      - name: Test
        run: npm test --prefix frontend

  desktop:
    name: Electron shell
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "21"
          cache: maven
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm
      - run: npm ci
      - name: Package the backend jar
        run: |
          chmod +x backend/mvnw
          ./backend/mvnw -B -f backend/pom.xml -DskipTests package
      - name: Typecheck and build
        run: |
          npm run typecheck --prefix desktop
          npm run build --prefix desktop
      - name: Test
        run: npm test --prefix desktop
